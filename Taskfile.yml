version: "3"

tasks:
  test:affected:
    desc: Explain deterministic affected selection; PLAN_ONLY, never executes tests
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- /usr/bin/python3 -B tooling/testops/testops.py affected {{.CLI_ARGS}}

  test:inventory:
    desc: Inventory tracked test and command declarations without executing them
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- /usr/bin/python3 -B tooling/testops/testops.py inventory

  checkpoint:
    desc: Validate exact-source evidence for a local unaccepted checkpoint; never commits or accepts
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/checkpoint.mjs {{.CLI_ARGS}}

  ci:
    desc: Complete local source/build gate; ci:fast remains a compatibility alias, native/package/live qualification stays separate
    cmds:
      - task: output:guard
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run ci
      - task: test:core
      - task: test:tooling
      - task: test:witness-inputs
      - task: output:check
      - task: scan:secrets

  ci:cloud:
    desc: Portable source integration gate; native/resource/mixed and package acceptance remain separate
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run ci:cloud
      - task: test:core
      - task: test:tooling
      - task: scan:secrets

  test:cloud:
    desc: Portable source suites with an explicit NOT RUN native-resource manifest
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/test-scopes.mjs --scope=cloud {{.CLI_ARGS}}

  test:core:
    desc: Verify Go modules, generated desktop bridge, protocol, and import boundaries
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/check-core.mjs

  test:tooling:
    desc: Check the declared toolchain and bounded planner, inventory and scheduler fixture regressions
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run check:toolchain
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- /usr/bin/python3 -B -m unittest discover -s tooling/testops -p 'test_*.py'
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node --test --test-concurrency=1 --test-reporter=tap tooling/testops/catalog.test.mjs tooling/testops/languagegraph.test.mjs tooling/testops/iteration-witness.test.mjs

  test:witness-inputs:
    desc: Check exact-package witness imports against the sealed candidate input graph (Darwin; uses the reviewed packaging compiler)
    platforms: [darwin]
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/build.mjs --check-witness-inputs

  test:unit:
    desc: Unit/component selection across TypeScript, React and Go; --list shows the plan
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/test-scopes.mjs --scope=unit {{.CLI_ARGS}}

  test:integration:
    desc: Module, process and native integration without repeating unit suites
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/test-scopes.mjs --scope=integration {{.CLI_ARGS}}

  test:fast:
    desc: Unit/component plus four explicit browser-free integration files
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/test-scopes.mjs --scope=fast {{.CLI_ARGS}}

  dev:
    # The owner's one development command: pick the declared toolchain, make
    # sure dependencies match the lock, build the clean committed React/Go
    # source using approved local inputs, and run it in this terminal.
    # This is not `task package` / `task run`, which build
    # and launch only an exact, committed, verified candidate; both keep their
    # current strict behavior unchanged. Ctrl+C stops only what this started.
    desc: Ordinary React/Go Dev - toolchain, locked deps, approved Go inputs, run here (not a candidate)
    cmds:
      - task: output:guard
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/dev.mjs {{.CLI_ARGS}}

  dev:clean:
    desc: Start Dev with a new isolated first-run profile; preserve daily Dev
    cmds:
      - task: output:guard
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/dev.mjs --fresh-review-profile {{.CLI_ARGS}}

  e2e:setup:
    desc: Build exact Dev bytes and check the fixture-only four-step Setup journey
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/dev.mjs --check
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/setup-journey.e2e.mjs {{.CLI_ARGS}}

  package:
    desc: Build, assemble, and verify the explicit unsigned Farol app
    cmds:
      # A candidate is built from a clean environment by the declared Node
      # itself, not through npm: no NODE_OPTIONS, NODE_PATH, npm node-options
      # or other startup hook runs before the compiler is authenticated. The
      # wrapper runs isolated (-I), so no user-site .pth or usercustomize runs.
      # This is the only entrypoint that produces a candidate.
      - |
        # Prefer the declared nvm LTS, without inheriting caller PATH or hooks.
        clean_path="${HOME:?task package requires HOME}/.nvm/versions/node/v24.20.0/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
        if ! node_path="$(PATH="$clean_path" command -v node)" || [ -z "$node_path" ]; then
          echo "task package requires the declared Node toolchain on $clean_path" >&2
          exit 1
        fi
        /usr/bin/env -i \
          HOME="${HOME:?task package requires HOME}" \
          LANG="${LANG:-en_US.UTF-8}" \
          PATH="$clean_path" \
          TMPDIR="${TMPDIR:-/tmp}" \
          /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- \
          /bin/sh -c '"$0" tooling/build.mjs "$@" && "$0" tooling/package.mjs "$@"' \
          "$node_path" {{.CLI_ARGS}}

  run:
    desc: Launch the exact verified Farol packaged candidate; never builds or installs Legacy
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        if ! node_path="$(PATH="$clean_path" command -v node)" || [ -z "$node_path" ]; then
          echo "task run requires Node to verify the candidate; install the declared toolchain before launching it" >&2
          exit 1
        fi
        /usr/bin/env -i \
          FAROL_OWNER_LAUNCH=1 \
          FAROL_SAVED_CHAT_PREVIEW="${FAROL_SAVED_CHAT_PREVIEW:-0}" \
          HOME="${HOME:?task run requires HOME}" \
          LANG="${LANG:-en_US.UTF-8}" \
          LC_ALL="${LC_ALL:-}" \
          PATH="$clean_path" \
          TMPDIR="${TMPDIR:-/tmp}" \
          /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- \
          "$node_path" tooling/run-preview.mjs {{.CLI_ARGS}}

  preview:development:
    desc: Legacy development-only preview; runs existing build without rebuilding
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run preview

  preview:
    desc: Build verified current-main Owner Preview, smoke, and run on demand
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        node_path="$(PATH="$clean_path" command -v node)"
        /usr/bin/env -i \
          HOME="${HOME:?task preview requires HOME}" \
          LANG="${LANG:-en_US.UTF-8}" \
          PATH="$clean_path" \
          TMPDIR="${TMPDIR:-/tmp}" \
          /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- \
          "$node_path" tooling/owner-preview.mjs build-run {{.CLI_ARGS}}

  preview:plan:
    desc: Inspect current-main Owner Preview plan; no package or app launch
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        node_path="$(PATH="$clean_path" command -v node)"
        /usr/bin/env -i \
          HOME="${HOME:?task preview:plan requires HOME}" \
          LANG="${LANG:-en_US.UTF-8}" \
          PATH="$clean_path" \
          TMPDIR="${TMPDIR:-/tmp}" \
          /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- \
          "$node_path" tooling/owner-preview.mjs plan {{.CLI_ARGS}}

  preview:build:
    desc: Build and smoke a strict Owner Preview derivative from current main
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        node_path="$(PATH="$clean_path" command -v node)"
        /usr/bin/env -i \
          HOME="${HOME:?task preview:build requires HOME}" \
          LANG="${LANG:-en_US.UTF-8}" \
          PATH="$clean_path" \
          TMPDIR="${TMPDIR:-/tmp}" \
          /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- \
          "$node_path" tooling/owner-preview.mjs build {{.CLI_ARGS}}

  preview:run:
    desc: Verify and smoke the pinned current Preview generation, then run
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        node_path="$(PATH="$clean_path" command -v node)"
        /usr/bin/env -i \
          HOME="${HOME:?task preview:run requires HOME}" \
          LANG="${LANG:-en_US.UTF-8}" \
          PATH="$clean_path" \
          TMPDIR="${TMPDIR:-/tmp}" \
          /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- \
          "$node_path" tooling/owner-preview.mjs run {{.CLI_ARGS}}

  promote:
    desc: Plan a non-overwriting Next-only local promotion; pass --apply only as the owner action
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/promote-preview.mjs {{.CLI_ARGS}}

  recover:closed-computer:
    desc: Explicit NEW-only closed-app reconciliation; exact failed evidence retained, never a clean Quit receipt
    # Maintenance intentionally changes NEW lifecycle records. It is not a
    # test/guard exception: all CI/native/Dev guard modes stay unchanged.
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        node_path="$(PATH="$clean_path" command -v node)"
        /usr/bin/env -i \
          HOME="${HOME:?closed recovery requires HOME}" \
          LANG="en_US.UTF-8" PATH="$clean_path" TMPDIR="${TMPDIR:-/tmp}" \
          "$node_path" tooling/recover-closed-computer.mjs {{.CLI_ARGS}}

  retire:preview-install:
    desc: Explicit closed NEW slot migration; preserve old receipts/download, never replay an update
    # Owner maintenance, not a CI or native-test guard exemption. V0 and the
    # destination Farol.app must be preserved separately before this command.
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        node_path="$(PATH="$clean_path" command -v node)"
        /usr/bin/env -i \
          HOME="${HOME:?preview retirement requires HOME}" \
          LANG="en_US.UTF-8" PATH="$clean_path" TMPDIR="${TMPDIR:-/tmp}" \
          "$node_path" tooling/retire-preview-install.mjs {{.CLI_ARGS}}

  test:e2e:dev:
    desc: Exercise exact clean development bytes; explicit test display, fault runs hidden
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:dev -- {{.CLI_ARGS}}

  test:soak:
    desc: Run the hidden deterministic 50-cycle Farol lifecycle and resource soak
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:soak -- {{.CLI_ARGS}}

  test:persistence-fault:
    desc: Prove live task persistence failure remains visible and fails closed
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:persistence-fault -- {{.CLI_ARGS}}

  test:two-generation-state:
    desc: Prove owner state across the predecessor and this package (pass --predecessor-artifact=<its manifest>)
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:two-generation-state -- {{.CLI_ARGS}}

  test:e2e:
    desc: Exercise the packaged preview; explicit test display, fault runs hidden
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e -- {{.CLI_ARGS}}

  test:e2e:guided-setup:
    desc: Check normal Preview and Dev Setup/Browser using owned hidden fixtures
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:guided-setup -- {{.CLI_ARGS}}

  test:e2e:guided-setup:package:
    desc: Check normal packaged Setup/Browser using owned hidden fixtures
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:guided-setup:package -- {{.CLI_ARGS}}

  test:e2e:setup-config-error:
    desc: Check classified configuration faults keep sidebar Setup in owned hidden profiles
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:setup-config-error -- {{.CLI_ARGS}}

  test:e2e:setup-config-error:package:
    desc: Check packaged configuration faults keep sidebar Setup in owned hidden profiles
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:setup-config-error:package -- {{.CLI_ARGS}}

  test:e2e:owner-preview-isolation:
    desc: Witness normal and Owner Preview isolation on live disposable instances (pass --generation <64hex>)
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/owner-preview-isolation.e2e.mjs {{.CLI_ARGS}}

  test:e2e:update:package:
    desc: Check real source and bundled package identities against the updater contract
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/update-package-identity.e2e.mjs
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/update-stage-cleanup.e2e.mjs
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/update-stage-cleanup.e2e.mjs --child-dispatch-fault
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/update-stage-cleanup.e2e.mjs --probe-timeout-fault

  ci:fast:
    desc: Compatibility alias for ci; there is no separate fast gate
    cmds:
      - task: ci

  output:status:
    desc: Report every _output entry as current, protected, active, kept, removable or unknown
    cmds:
      - node tooling/output-retention.mjs status

  output:prune:
    desc: Remove finished owned scratch and expired or over-cap undeclared evidence; keeps everything else
    cmds:
      - node tooling/output-retention.mjs prune

  output:guard:
    desc: Prune, then refuse heavy work while _output stays over its budget
    internal: true
    cmds:
      - node tooling/output-retention.mjs guard

  disk:status:
    desc: One report for _output and Farol-owned Docker volumes; run at the end of a task
    cmds:
      - node tooling/output-retention.mjs status
      - /usr/bin/python3 -B tooling/testops/testops.py volumes status

  output:check:
    desc: Check the generated build, coverage, Hunt, logs and scratch layout
    cmds:
      - test -f _output/build/app/build-manifest.json
      - test -f _output/evidence/hunt/latest.json
      - test -d _output/coverage
      - test -d _output/logs
      - test -d _output/tmp
      - |
        for item in _output/build/app _output/package _output/evidence/hunt _output/coverage _output/logs _output/tmp; do
          git check-ignore -q "$item" || exit 1
        done

  scan:secrets:
    cmds:
      - ./scripts/scan-secrets.sh
