version: "3"

tasks:
  checkpoint:
    desc: Validate exact-source evidence for a local unaccepted checkpoint; never commits or accepts
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/checkpoint.mjs {{.CLI_ARGS}}

  ci:
    desc: Farol Next deterministic architecture, policy, coverage, Hunt, and _output build gate
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run ci
      - task: test:core

  test:core:
    desc: Verify Go modules, generated desktop bridge, protocol, and import boundaries
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/check-core.mjs

  dev:
    # The owner's one development command: pick the declared toolchain, make
    # sure dependencies match the lock, build whatever is on disk right now
    # (uncommitted changes included, and said so plainly), and run it in this
    # terminal. This is not `task package` / `task run`, which build
    # and launch only an exact, committed, verified candidate; both keep their
    # current strict behavior unchanged. Ctrl+C stops only what this started.
    desc: One development entrypoint - toolchain, locked deps, current dev build, run here (not a candidate)
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/dev.mjs {{.CLI_ARGS}}

  package:
    desc: Build, assemble, and verify the explicit unsigned Farol Next Preview app
    cmds:
      # A candidate is built from a clean environment by the declared Node
      # itself, not through npm: no NODE_OPTIONS, NODE_PATH, npm node-options
      # or other startup hook runs before the compiler is authenticated. The
      # wrapper runs isolated (-I), so no user-site .pth or usercustomize runs.
      # This is the only entrypoint that produces a candidate.
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        if ! node_path="$(PATH="$clean_path" command -v node)" || [ -z "$node_path" ]; then
          echo "task package requires the declared Node toolchain on $clean_path" >&2
          exit 1
        fi
        /usr/bin/env -i \
          HOME="${HOME:?task package requires HOME}" \
          LANG="${LANG:-en_US.UTF-8}" \
          PATH="$clean_path" \
          TMPDIR="${TMPDIR:-/tmp}" \
          /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- \
          /bin/sh -c '"$0" tooling/build.mjs "$@" && "$0" tooling/package.mjs "$@"' \
          "$node_path" {{.CLI_ARGS}}

  run:
    desc: Launch the exact verified Farol Next packaged candidate; never builds or installs Legacy
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        if ! node_path="$(PATH="$clean_path" command -v node)" || [ -z "$node_path" ]; then
          echo "task run requires Node to verify the candidate; install the declared toolchain before launching it" >&2
          exit 1
        fi
        /usr/bin/env -i \
          FAROL_NEXT_OWNER_LAUNCH=1 \
          FAROL_NEXT_SAVED_CHAT_PREVIEW="${FAROL_NEXT_SAVED_CHAT_PREVIEW:-0}" \
          HOME="${HOME:?task run requires HOME}" \
          LANG="${LANG:-en_US.UTF-8}" \
          LC_ALL="${LC_ALL:-}" \
          PATH="$clean_path" \
          TMPDIR="${TMPDIR:-/tmp}" \
          /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- \
          "$node_path" tooling/run-preview.mjs {{.CLI_ARGS}}

  preview:
    desc: Build and launch the development-only Farol Next preview (not the packaged candidate)
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run preview

  promote:
    desc: Plan a non-overwriting Next-only local promotion; pass --apply only as the owner action
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tooling/promote-preview.mjs {{.CLI_ARGS}}

  recover:closed-computer:
    desc: Explicit NEW-only closed-app reconciliation; exact failed evidence retained, never a clean Quit receipt
    # Maintenance intentionally changes NEW lifecycle records. It is not a
    # test/guard exception: all CI/native/Dev guard modes stay unchanged.
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        node_path="$(PATH="$clean_path" command -v node)"
        /usr/bin/env -i \
          HOME="${HOME:?closed recovery requires HOME}" \
          LANG="en_US.UTF-8" PATH="$clean_path" TMPDIR="${TMPDIR:-/tmp}" \
          "$node_path" tooling/recover-closed-computer.mjs {{.CLI_ARGS}}

  retire:preview-install:
    desc: Explicit closed NEW slot migration; preserve old receipts/download, never replay an update
    # Owner maintenance, not a CI or native-test guard exemption. V0 and the
    # destination Farol.app must be preserved separately before this command.
    cmds:
      - |
        clean_path=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        node_path="$(PATH="$clean_path" command -v node)"
        /usr/bin/env -i \
          HOME="${HOME:?preview retirement requires HOME}" \
          LANG="en_US.UTF-8" PATH="$clean_path" TMPDIR="${TMPDIR:-/tmp}" \
          "$node_path" tooling/retire-preview-install.mjs {{.CLI_ARGS}}

  test:e2e:dev:
    desc: Exercise exact clean development bytes; explicit test display, fault runs hidden
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:dev -- {{.CLI_ARGS}}

  test:soak:
    desc: Run the hidden deterministic 50-cycle Farol Next lifecycle and resource soak
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:soak -- {{.CLI_ARGS}}

  test:persistence-fault:
    desc: Prove live task persistence failure remains visible and fails closed
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:persistence-fault -- {{.CLI_ARGS}}

  test:two-generation-state:
    desc: Prove owner state across the predecessor and this package (pass --predecessor-artifact=<its manifest>)
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:two-generation-state -- {{.CLI_ARGS}}

  test:e2e:
    desc: Exercise the packaged preview; explicit test display, fault runs hidden
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e -- {{.CLI_ARGS}}

  test:e2e:guided-setup:
    desc: Check normal Preview and Dev Setup/Browser using owned hidden fixtures
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:guided-setup -- {{.CLI_ARGS}}

  test:e2e:guided-setup:package:
    desc: Check normal packaged Setup/Browser using owned hidden fixtures
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:guided-setup:package -- {{.CLI_ARGS}}

  test:e2e:setup-config-error:
    desc: Check classified configuration faults keep sidebar Setup in owned hidden profiles
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:setup-config-error -- {{.CLI_ARGS}}

  test:e2e:setup-config-error:package:
    desc: Check packaged configuration faults keep sidebar Setup in owned hidden profiles
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- npm run test:e2e:setup-config-error:package -- {{.CLI_ARGS}}

  test:e2e:update:package:
    desc: Check real source and bundled package identities against the updater contract
    cmds:
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/update-package-identity.e2e.mjs
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/update-stage-cleanup.e2e.mjs
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/update-stage-cleanup.e2e.mjs --child-dispatch-fault
      - /usr/bin/python3 -I ./scripts/assert-owner-untouched.py -- node tests/e2e/update-stage-cleanup.e2e.mjs --probe-timeout-fault

  ci:fast:
    desc: Complete deterministic standalone gate without native UI
    cmds:
      - task: ci
      - task: output:check
      - task: scan:secrets

  output:check:
    desc: Check the generated build, coverage, Hunt, logs and scratch layout
    cmds:
      - test -f _output/build/app/build-manifest.json
      - test -f _output/evidence/hunt/latest.json
      - test -d _output/coverage
      - test -d _output/logs
      - test -d _output/tmp
      - |
        for item in _output/build/app _output/package _output/evidence/hunt _output/coverage _output/logs _output/tmp; do
          git check-ignore -q "$item" || exit 1
        done

  scan:secrets:
    cmds:
      - ./scripts/scan-secrets.sh
