name: Locked CI tools
description: Install declared tools and cache downloads without caching build outputs
inputs:
  native:
    description: Install the Darwin Electron runtime and select Apple developer tools
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24.20.0
        cache: npm
    # The official go.dev archive, verified and extracted unchanged. Its tree
    # is the SDK the release and native archive pins approve; a repackaged
    # toolcache SDK is not. Only module downloads are cached, below.
    - name: Install the official Go SDK
      shell: bash
      run: |
        case "$(uname -s)-$(uname -m)" in
          Darwin-arm64)
            archive=go1.26.2.darwin-arm64.tar.gz
            sha256=32af1522bf3e3ff3975864780a429cc0b41d190ec7bf90faa661d6d64566e7af ;;
          Linux-x86_64)
            archive=go1.26.2.linux-amd64.tar.gz
            sha256=990e6b4bbba816dc3ee129eaeaf4b42f17c2800b88a2166c265ac1a200262282 ;;
          *) echo "GO_SDK_PLATFORM_UNSUPPORTED" >&2; exit 1 ;;
        esac
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://go.dev/dl/$archive"
        echo "$sha256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
        mkdir -p "$RUNNER_TEMP/go-sdk"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/go-sdk"
        rm "$RUNNER_TEMP/$archive"
        echo "$RUNNER_TEMP/go-sdk/go/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/go-sdk/go/bin/go" version
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'resources/native/go/go.sum') }}
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/electron-cache
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
    - name: Install locked npm dependencies
      shell: bash
      env:
        electron_config_cache: ${{ runner.temp }}/electron-cache
        INSTALL_NATIVE: ${{ inputs.native }}
      run: |
        npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
        npm run check:toolchain
        npm ci --ignore-scripts --no-audit --no-fund
        node node_modules/esbuild/install.js
        if [ "$INSTALL_NATIVE" = true ]; then
          node node_modules/electron/install.js
        fi
        git diff --exit-code -- package-lock.json
    - name: Install gate tools and resolve Go inputs
      shell: bash
      run: |
        go install github.com/go-task/task/v3/cmd/task@v3.44.1
        go install github.com/zricethezav/gitleaks/v8@v8.28.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        go mod download
        (cd resources/native/go && go mod download)
    - name: Select native tools at the existing clean search paths
      if: inputs.native == 'true'
      shell: bash
      run: |
        test "$(uname -s)" = Darwin
        test "$(uname -m)" = arm64
        test -d /Library/Developer/CommandLineTools
        sudo /usr/bin/xcode-select --switch /Library/Developer/CommandLineTools
        test "$(/usr/bin/xcode-select -p)" = /Library/Developer/CommandLineTools
        test "$(/usr/bin/xcrun --find python3)" = /Library/Developer/CommandLineTools/usr/bin/python3
        test "$(/usr/bin/xcrun --find git)" = /Library/Developer/CommandLineTools/usr/bin/git
        # Candidate tools scrub PATH. Expose the selected hosted tools there.
        sudo ln -sf "$(command -v node)" /opt/homebrew/bin/node
        sudo ln -sf "$(command -v go)" /opt/homebrew/bin/go
