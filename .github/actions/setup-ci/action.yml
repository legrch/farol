name: Locked CI tools
description: Install declared tools and cache downloads without caching build outputs
inputs:
  native:
    description: Install the Darwin Electron runtime and select Apple developer tools
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24.20.0
        cache: npm
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: 1.26.2
        cache-dependency-path: |
          go.sum
          resources/native/go/go.sum
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/electron-cache
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
    - name: Install locked npm dependencies
      shell: bash
      env:
        electron_config_cache: ${{ runner.temp }}/electron-cache
        INSTALL_NATIVE: ${{ inputs.native }}
      run: |
        npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
        npm run check:toolchain
        npm ci --ignore-scripts --no-audit --no-fund
        node node_modules/esbuild/install.js
        if [ "$INSTALL_NATIVE" = true ]; then
          node node_modules/electron/install.js
        fi
        git diff --exit-code -- package-lock.json
    - name: Install gate tools and resolve Go inputs
      shell: bash
      run: |
        go install github.com/go-task/task/v3/cmd/task@v3.44.1
        go install github.com/zricethezav/gitleaks/v8@v8.28.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        go mod download
        (cd resources/native/go && go mod download)
    - name: Select native tools at the existing clean search paths
      if: inputs.native == 'true'
      shell: bash
      run: |
        test "$(uname -s)" = Darwin
        test "$(uname -m)" = arm64
        test -d /Library/Developer/CommandLineTools
        sudo /usr/bin/xcode-select --switch /Library/Developer/CommandLineTools
        test "$(/usr/bin/xcode-select -p)" = /Library/Developer/CommandLineTools
        test "$(/usr/bin/xcrun --find python3)" = /Library/Developer/CommandLineTools/usr/bin/python3
        test "$(/usr/bin/xcrun --find git)" = /Library/Developer/CommandLineTools/usr/bin/git
        # Candidate tools scrub PATH. Expose the selected hosted tools there.
        sudo ln -sf "$(command -v node)" /opt/homebrew/bin/node
        sudo ln -sf "$(command -v go)" /opt/homebrew/bin/go
