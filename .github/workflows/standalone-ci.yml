name: Standalone source checks

# Pre-cutover: an owner may run checks explicitly after choosing this repository.
# No automatic publication, deployment, signing, installation, or release job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    # Matches the reviewed Apple tool-shim-public identity.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Select the locked toolchain
        run: |
          test "$(uname -m)" = arm64
          npm install --global npm@11.19.0
          npm run check:toolchain
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/esbuild/install.js
          node node_modules/electron/install.js
          git diff --exit-code -- package-lock.json
      - name: Install local gate tools
        run: brew install go-task gitleaks
      - name: Select reviewed Apple developer tools
        run: |
          # Hosted images default to versioned Xcode roots. The production
          # attestation accepts the canonical Command Line Tools location.
          test -d /Library/Developer/CommandLineTools
          sudo /usr/bin/xcode-select --switch /Library/Developer/CommandLineTools
          test "$(/usr/bin/xcode-select -p)" = /Library/Developer/CommandLineTools
          test "$(/usr/bin/xcrun --find python3)" = /Library/Developer/CommandLineTools/usr/bin/python3
          test "$(/usr/bin/xcrun --find git)" = /Library/Developer/CommandLineTools/usr/bin/git
      - name: Run protected standalone checks
        run: task ci:fast
      - name: Record Apple attestation inputs on failure
        if: failure()
        run: |
          /usr/bin/python3 - <<'PYTHON'
          import json, os, stat, subprocess
          environment = {"LANG": "C", "LC_ALL": "C"}
          def command(*args):
              result = subprocess.run(args, env=environment, text=True, capture_output=True)
              print(json.dumps({"command": args, "exitCode": result.returncode, "stdout": result.stdout, "stderr": result.stderr}))
              return result.stdout.strip()
          command("/usr/bin/xcode-select", "-p")
          python = command("/usr/bin/xcrun", "--find", "python3")
          git = command("/usr/bin/xcrun", "--find", "git")
          for executable in ("/usr/bin/python3", python, git):
              if not executable or not os.path.lexists(executable):
                  continue
              paths = [executable, os.path.realpath(executable)]
              if os.path.islink(executable):
                  paths.append(os.path.normpath(os.path.join(os.path.dirname(executable), os.readlink(executable))))
              for path in dict.fromkeys(paths):
                  info = os.lstat(path)
                  print(json.dumps({"path": path, "uid": info.st_uid, "mode": oct(stat.S_IMODE(info.st_mode)), "link": os.readlink(path) if stat.S_ISLNK(info.st_mode) else None}))
              command("/usr/bin/codesign", "-dv", "--verbose=4", os.path.realpath(executable))
          command("/usr/bin/python3", "--version")
          PYTHON
      - name: Require unchanged source
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"
