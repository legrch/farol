name: Standalone source checks

# Pre-cutover: an owner may run checks explicitly after choosing this repository.
# No automatic publication, deployment, signing, installation, or release job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Select the locked toolchain
        run: |
          test "$(uname -m)" = arm64
          npm install --global npm@11.19.0
          npm run check:toolchain
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/esbuild/install.js
          node node_modules/electron/install.js
          git diff --exit-code -- package-lock.json
      - name: Install local gate tools
        run: brew install go-task gitleaks
      - name: Run protected standalone checks
        run: task ci:fast
      - name: Require unchanged source
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"
