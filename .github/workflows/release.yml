name: Qualified prerelease

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: Prepare build-only assets, or publish previously qualified exact assets
        required: true
        type: choice
        options: [prepare, publish]
        default: prepare
      candidate_run_id:
        description: Prior successful build-only run ID (publish only)
        type: string
      manifest_sha256:
        description: SHA256 of the qualified downloaded farol-release.json (publish only)
        type: string

permissions:
  contents: read

# Serialize preparation/publication. Never cancel an issued operation.
concurrency:
  group: tagged-prerelease
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || inputs.action == 'prepare'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pushed tag object as published
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - uses: ./.github/actions/setup-ci
        with:
          native: "true"
      - name: Verify exact owner-beta source and accepted-main ancestry
        id: candidate
        run: node tooling/release-candidate.mjs prepare
      - name: Provision approved backend build inputs
        run: node tooling/ci-go-inputs.mjs
      - name: Run the full unchanged source gate including secret scans
        run: task ci
      - name: Build the exact clean candidate
        run: |
          test -z "$(git status --porcelain=v1)"
          task package -- --go-inputs="$GITHUB_WORKSPACE/_output/go-build-inputs.json"
      - name: D16 — Developer ID signing and notarization placeholder
        run: |
          echo 'UNSIGNED / NOT NOTARIZED: D16 requires a separate signing and notarization decision.'
          # Future signing must preserve package attestation and archive verification.
      - name: Prepare and verify the three public assets
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          node tooling/release-candidate.mjs prepare
          mkdir -p _output/release
          /usr/bin/python3 -I tooling/prepare-release-archive.py "$(git rev-parse HEAD)" "$GITHUB_WORKSPACE/_output/release/$RELEASE_TAG"
          node tooling/verify-release-assets.mjs "$GITHUB_WORKSPACE/_output/release/$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.candidate.outputs.artifactName }}
          if-no-files-found: error
          retention-days: 7
          path: |
            _output/release/${{ steps.candidate.outputs.tag }}/Farol-${{ steps.candidate.outputs.version }}-darwin-arm64.zip
            _output/release/${{ steps.candidate.outputs.tag }}/farol-release.json
            _output/release/${{ steps.candidate.outputs.tag }}/SHA256SUMS

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Bind the previous successful build-only run and immutable artifact
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/release-candidate.mjs metadata
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifactId }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: _output/public-release
          merge-multiple: true
      - name: Verify exact bytes and no-overwrite preconditions, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifactId }}
        # Re-fetch metadata, verify the supplied manifest SHA256, then invoke the
        # existing verifyReleaseAssets before creating an annotated tag/release.
        # No CI, package, archive preparation or rebuild in the publisher.
        run: node tooling/release-candidate.mjs publish
