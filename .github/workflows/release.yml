name: Qualified prerelease

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: Run build-only checks, or publish an exact qualified private draft
        required: true
        type: choice
        options: [prepare, publish]
        default: prepare
      candidate_run_id:
        description: Prior successful tag build-only run ID (publish only)
        type: string
      draft_release_id:
        description: Existing private draft release ID containing qualified local assets (publish only)
        type: string
      manifest_sha256:
        description: SHA256 of the native-qualified local farol-release.json (publish only)
        type: string

permissions:
  contents: read

# Serialize preparation/publication. Never cancel an issued operation.
concurrency:
  group: tagged-prerelease
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || inputs.action == 'prepare'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pushed tag object as published
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - uses: ./.github/actions/setup-ci
        with:
          native: "true"
      - name: Verify exact owner-beta source and accepted-main ancestry
        id: candidate
        run: node tooling/release-candidate.mjs prepare
      - name: Provision approved backend build inputs
        run: node tooling/ci-go-inputs.mjs
      - name: Run the full unchanged source gate including secret scans
        run: task ci
      - name: Build the exact clean candidate
        run: |
          test -z "$(git status --porcelain=v1)"
          task package -- --go-inputs="$GITHUB_WORKSPACE/_output/go-build-inputs.json"
      - name: D16 — Developer ID signing and notarization placeholder
        run: |
          echo 'UNSIGNED / NOT NOTARIZED: D16 requires a separate signing and notarization decision.'
          # Future signing must preserve package attestation and archive verification.
      - name: Prepare and verify the three public assets
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          node tooling/release-candidate.mjs prepare
          mkdir -p _output/release
          /usr/bin/python3 -I tooling/prepare-release-archive.py "$(git rev-parse HEAD)" "$GITHUB_WORKSPACE/_output/release/$RELEASE_TAG"
          node tooling/verify-release-assets.mjs "$GITHUB_WORKSPACE/_output/release/$RELEASE_TAG"
      # Hosted preparation stays on this runner. Public Actions artifacts are
      # readable before owner qualification; never upload binaries or diagnostics.

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Verify the tag build and qualified private draft, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
        # Read prior run/job metadata with actions:read; only this job can PATCH
        # the exact private draft. No rebuild, tag/release creation or asset upload.
        run: node tooling/release-candidate.mjs publish
