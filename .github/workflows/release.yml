name: Qualified release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: Run build-only checks, or publish an exact qualified private draft
        required: true
        type: choice
        options: [prepare, publish, diagnostic-0356, network-0429, witness-0450, cold-0518, private-state-0545]
        default: prepare
      candidate_run_id:
        description: Prior successful tag build-only run ID (publish only)
        type: string
      draft_release_id:
        description: Existing private draft release ID containing qualified local assets (publish only)
        type: string
      manifest_sha256:
        description: SHA256 of the native-qualified local farol-release.json (publish only)
        type: string

permissions:
  contents: read

# Serialize preparation/publication. Never cancel an issued operation.
concurrency:
  group: tagged-prerelease
  cancel-in-progress: false

jobs:
  v058-private-state-0545:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'private-state-0545'
    strategy:
      fail-fast: false
      matrix:
        scenario: [cold, control]
    runs-on: macos-26
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Fetch exact public diagnostic commit without credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --no-checkout https://github.com/legrch/farol.git "$RUNNER_TEMP/witness-source"
          git -C "$RUNNER_TEMP/witness-source" checkout -q --detach "$GITHUB_SHA"
          test "$(git -C "$RUNNER_TEMP/witness-source" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Observe private-state scenario
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          cd "$RUNNER_TEMP/witness-source"
          /usr/bin/python3 -I .github/diagnostics/v058-private-state-0545.py "$SCENARIO"
      - name: Preserve bounded observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farol-v058-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/farol-v058-witness/*.txt
            ${{ runner.temp }}/farol-v058-witness/*.json
          if-no-files-found: warn
          retention-days: 7

  v058-cold-0518:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'cold-0518'
    runs-on: macos-26
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Fetch exact public diagnostic commit without credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --no-checkout https://github.com/legrch/farol.git "$RUNNER_TEMP/witness-source"
          git -C "$RUNNER_TEMP/witness-source" checkout -q --detach "$GITHUB_SHA"
          test "$(git -C "$RUNNER_TEMP/witness-source" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Observe cold startup with marker
        shell: bash
        run: |
          cd "$RUNNER_TEMP/witness-source"
          /usr/bin/python3 -I .github/diagnostics/v058-cold-0518.py
      - name: Preserve bounded observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farol-v058-cold-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/farol-v058-witness/*.txt
            ${{ runner.temp }}/farol-v058-witness/*.json
          if-no-files-found: warn
          retention-days: 7

  v058-preseed-witness:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'witness-0450'
    runs-on: macos-26
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Fetch exact public diagnostic commit without credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --no-checkout https://github.com/legrch/farol.git "$RUNNER_TEMP/witness-source"
          git -C "$RUNNER_TEMP/witness-source" checkout -q --detach "$GITHUB_SHA"
          test "$(git -C "$RUNNER_TEMP/witness-source" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Observe one preseeded published-binary witness
        shell: bash
        run: |
          cd "$RUNNER_TEMP/witness-source"
          /usr/bin/python3 -I .github/diagnostics/v058-preseed-witness.py
      - name: Preserve bounded observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farol-v058-preseed-witness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/farol-v058-witness/*.txt
            ${{ runner.temp }}/farol-v058-witness/*.json
          if-no-files-found: warn
          retention-days: 7

  native-https-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'network-0429'
    runs-on: macos-26
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Inspect direct HTTPS without starting Farol or using credentials
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import https from 'node:https';
          const headers = {'User-Agent':'Farol-Update/1', 'Accept':'application/vnd.github+json', 'Accept-Encoding':'identity'};
          const request = (url) => new Promise((resolve) => {
            const req = https.get(url, {headers, rejectUnauthorized:true, agent:false}, res => {
              const meta = {host:new URL(url).hostname, status:res.statusCode, encoding:res.headers['content-encoding'] ?? null, length:res.headers['content-length'] ?? null, rateLimit:res.headers['x-ratelimit-limit'] ?? null, rateRemaining:res.headers['x-ratelimit-remaining'] ?? null, redirectHost:res.headers.location ? new URL(res.headers.location).hostname : null};
              let bytes = 0; res.on('data', b => { bytes += b.length; });
              res.on('end', () => resolve({ ...meta, bytes, complete:res.complete, location:res.headers.location ?? null }));
              res.on('error', e => resolve({ ...meta, error:e.code ?? e.name }));
            });
            req.setTimeout(30000, () => req.destroy(new Error('HTTPS request timeout')));
            req.on('error', e => resolve({host:new URL(url).hostname, error:e.code ?? e.name}));
          });
          console.log('node', process.version, 'platform', process.platform, process.arch);
          for (const [name,url] of [['catalogue','https://api.github.com/repos/legrch/farol/releases?per_page=100'], ['manifest','https://github.com/legrch/farol/releases/download/v0.5.8/farol-release.json']]) {
            const first = await request(url);
            const { location, ...safe } = first; console.log(name, JSON.stringify(safe));
            if (location && first.redirectHost === 'release-assets.githubusercontent.com') {
              const next = await request(location); const { location:ignored, ...safeNext } = next;
              console.log(name + '-cdn', JSON.stringify(safeNext));
            }
          }
          NODE

  api-rate-limit-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'diagnostic-0356'
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Compare exact release-catalogue response without and with runner token
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint='https://api.github.com/repos/legrch/farol/releases?per_page=100'
          headers="$RUNNER_TEMP/farol-api-rate-headers"
          trap 'rm -f "$headers"' EXIT
          echo 'UNAUTHENTICATED'
          curl --silent --show-error --max-time 30 --dump-header "$headers" --output /dev/null --write-out 'HTTP status: %{http_code}\n' --header 'User-Agent: Farol' --header 'Accept: application/vnd.github+json' "$endpoint"
          awk 'tolower($0) ~ /^x-ratelimit-(limit|remaining|reset|resource):/ {gsub("\r", "");print}' "$headers"
          echo 'GITHUB_TOKEN'
          printf 'header = "Authorization: Bearer %s"\n' "$API_TOKEN" | curl --config - --silent --show-error --max-time 30 --dump-header "$headers" --output /dev/null --write-out 'HTTP status: %{http_code}\n' --header 'User-Agent: Farol' --header 'Accept: application/vnd.github+json' "$endpoint"
          awk 'tolower($0) ~ /^x-ratelimit-(limit|remaining|reset|resource):/ {gsub("\r", "");print}' "$headers"

  cleanup-targeted-regression:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'diagnostic-0356'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1cff2cd9020a24820843dd53b8ec6b9b7656b401
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          native: "true"
      - name: Run one fresh isolated revocation regression
        run: |
          test "$(git rev-parse HEAD)" = 1cff2cd9020a24820843dd53b8ec6b9b7656b401
          node node_modules/vitest/vitest.mjs run tests/integration/sandboxed-workspace-shell.test.ts -t 'stops an admitted shell on current owner revocation while retaining cleanup proof'

  build:
    if: github.event_name == 'push' || inputs.action == 'prepare'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pushed tag object as published
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # Checkout may have created a peeled local tag. Fetch the published
        # annotated object separately, without replacing that local ref.
        run: git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/farol/published-release-tag"
      - uses: ./.github/actions/setup-ci
        with:
          native: "true"
      - name: Verify exact release channel, source and accepted-main ancestry
        id: candidate
        run: node tooling/release-candidate.mjs prepare
      - name: Provision approved backend build inputs
        run: node tooling/ci-go-inputs.mjs
      - name: Run the full unchanged source gate including secret scans
        run: task ci
      - name: Build the exact clean candidate
        run: |
          test -z "$(git status --porcelain=v1)"
          task package -- --go-inputs="$GITHUB_WORKSPACE/_output/go-build-inputs.json"
      - name: D16 — Developer ID signing and notarization placeholder
        run: |
          echo 'UNSIGNED / NOT NOTARIZED: D16 requires a separate signing and notarization decision.'
          # Future signing must preserve package attestation and archive verification.
      - name: Prepare and verify the three public assets
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          node tooling/release-candidate.mjs prepare
          mkdir -p _output/release
          /usr/bin/python3 -I tooling/prepare-release-archive.py "$(git rev-parse HEAD)" "$GITHUB_WORKSPACE/_output/release/$RELEASE_TAG"
          node tooling/verify-release-assets.mjs "$GITHUB_WORKSPACE/_output/release/$RELEASE_TAG"
      # Hosted preparation stays on this runner. Public Actions artifacts are
      # readable before owner qualification; never upload binaries or diagnostics.

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Verify the tag build and qualified private draft, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
        # Read prior run/job metadata with actions:read; only this job can PATCH
        # the exact private draft. No rebuild, tag/release creation or asset upload.
        run: node tooling/release-candidate.mjs publish
