name: Linux portable source checks

# Source validation only. No automatic trigger, package, installation or release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.2
          cache: false
      - name: Select locked source toolchains
        run: |
          npm install --global npm@11.19.0
          npm run check:toolchain
          test "$(go env GOVERSION)" = go1.26.2
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          command -v gcc
          /usr/bin/python3 --version
      - name: Install pinned source gate tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.5
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/esbuild/install.js
          node node_modules/electron/install.js
          git diff --exit-code -- package-lock.json
      - name: Run unchanged portable source gate
        id: gate
        run: task ci:cloud
      - name: Require unchanged source
        if: always()
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"
      - name: Preserve source-only outcome
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          /usr/bin/python3 - <<'PY'
          import json, os, pathlib, subprocess
          receipt = {
              "schema": "farol-linux-source-workflow/1",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "runner": os.environ["RUNNER_OS"],
              "gate": "task ci:cloud",
              "outcome": os.environ["GATE_OUTCOME"],
              "notRun": ["native capability qualification", "package", "installation", "live providers", "OTA/rollback", "Windows acceptance"],
          }
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "farol-linux-source-receipt.json"
          target.write_text(json.dumps(receipt, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Linux portable source gate: " + receipt["outcome"] + "\n\n")
              summary.write("Source-only evidence. Native, package, installed, live and Windows acceptance are NOT RUN.\n")
          PY
      - name: Upload source-only receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-source-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/farol-linux-source-receipt.json
          if-no-files-found: error
          retention-days: 14
