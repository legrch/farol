name: Pull request checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Classify the complete merge candidate with the base classifier
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The classifier decides whether heavy jobs may be skipped, so it runs
        # as committed on the base branch; a pull request cannot rewrite it to
        # skip its own checks. Without a base classifier nothing is skipped.
        run: |
          if git cat-file -e "$PR_BASE_SHA:tooling/ci-paths.mjs" 2>/dev/null; then
            git show "$PR_BASE_SHA:tooling/ci-paths.mjs" > "$RUNNER_TEMP/ci-paths.mjs"
            node "$RUNNER_TEMP/ci-paths.mjs"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Check every candidate including docs-only changes
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run architecture
          npm run runtime:check
          npm run docs:check
          node node_modules/vitest/vitest.mjs run tests/tooling/delivery-policy.test.mjs tests/tooling/ci-policy.test.mjs
          task scan:secrets
      - name: Require unchanged source
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"

  portable:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Run the portable source profile
        run: task ci:cloud
      - name: Show the failed portable cases
        if: failure()
        run: node tooling/print-failed-scope.mjs _output/evidence/test-scopes
      - name: Require unchanged source
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"

  native:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          native: "true"
      - name: Run deferred Darwin cases and Go platform checks
        run: |
          /usr/bin/python3 -I scripts/assert-owner-untouched.py -- node tooling/ci-native.mjs
          task test:core
          task test:witness-inputs
      - name: Exercise packaged installer backend in the empty shared slot
        if: github.event.pull_request.number == 118
        run: |
          set -eu
          node tooling/ci-go-inputs.mjs
          task package -- --go-inputs="$GITHUB_WORKSPACE/_output/go-build-inputs.json"
          test ! -e /Applications/Farol.app
          evidence=$(mktemp -d /private/tmp/farol-installer-native.XXXXXXXX)
          chmod 700 "$evidence"
          mkdir -p "$evidence/extracted"
          /usr/bin/ditto _output/package/Farol.app "$evidence/extracted/Farol.app"
          /usr/bin/ditto _output/package/Farol.app "$evidence/staged.app"
          /usr/bin/python3 -I - "$evidence/farol-release.json" <<'PY'
          import json, sys
          with open('_output/package/artifact.json', encoding='utf-8') as stream:
              artifact = json.load(stream)
          with open(sys.argv[1], 'w', encoding='utf-8') as stream:
              json.dump({'schema': 'farol.github-release/1', 'repository': 'legrch/farol',
                         'version': artifact['version'], 'platform': 'darwin', 'arch': 'arm64',
                         'artifactSha256': artifact['artifactSha256'], 'buildId': artifact['buildId']}, stream)
          PY
          "$evidence/extracted/Farol.app/Contents/Resources/app/farol-backend" run-install-release-swap --staged-app "$evidence/staged.app" --manifest "$evidence/farol-release.json" --installed /Applications/Farol.app --evidence "$evidence"
          test -d /Applications/Farol.app
          test ! -e "$evidence/staged.app"
          installed_identity=$(/usr/bin/stat -f '%d:%i' /Applications/Farol.app)
          second=$(mktemp -d /private/tmp/farol-installer-native.XXXXXXXX)
          chmod 700 "$second"
          mkdir -p "$second/extracted"
          /usr/bin/ditto _output/package/Farol.app "$second/extracted/Farol.app"
          /usr/bin/ditto _output/package/Farol.app "$second/staged.app"
          cp "$evidence/farol-release.json" "$second/farol-release.json"
          if "$second/extracted/Farol.app/Contents/Resources/app/farol-backend" run-install-release-swap --staged-app "$second/staged.app" --manifest "$second/farol-release.json" --installed /Applications/Farol.app --evidence "$second" >"$second/stdout" 2>"$second/stderr"; then
            echo 'occupied shared slot was unexpectedly accepted' >&2
            exit 1
          fi
          grep -Fx 'INSTALL_OCCUPIED_SLOT_UNSUPPORTED' "$second/stderr"
          test "$(/usr/bin/stat -f '%d:%i' /Applications/Farol.app)" = "$installed_identity"
          test -d "$second/staged.app"
          test ! -e "$second/previous.app"
          test -d /Applications/Farol.app
          printf 'PASS: packaged backend filled empty slot and refused occupied slot\n'
      - name: Observe hidden LaunchServices guardian and helper
        if: github.event.pull_request.number == 115
        run: |
          node_modules/esbuild/bin/esbuild src/modules/release/infra/native/desktop-helper-lifetime.ts --bundle --platform=node --format=cjs --outfile="$RUNNER_TEMP/farol-lifetime-witness.cjs"
          FAROL_LIVE_HELPER_NATIVE=1 \
          FAROL_DESKTOP_LAUNCHER_NATIVE=1 \
          FAROL_TEST_HELPER_ELECTRON="$GITHUB_WORKSPACE/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron" \
          FAROL_TEST_LIFETIME_MODULE="$RUNNER_TEMP/farol-lifetime-witness.cjs" \
          go test ./boot -run '^TestDesktopLauncherNativeRelaunchAfterHelper$' -v -count=1
      - name: Show the failed native cases
        if: failure()
        run: node tooling/print-failed-scope.mjs _output/evidence/test-scopes
      - name: Require unchanged source
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"

  required:
    if: always()
    needs: [changes, checks, portable, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful checks or verified docs-only skips
        env:
          CHECKS: ${{ needs.checks.result }}
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PORTABLE: ${{ needs.portable.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          test "$CHANGES" = success
          test "$CHECKS" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$PORTABLE" = skipped
            test "$NATIVE" = skipped
          else
            test "$PORTABLE" = success
            test "$NATIVE" = success
          fi
