<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"
  />
  <title>Farol · Design room</title>
  <style>
    @font-face {
      font-family: Geist;
      src: url("assets/Geist-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e8e9ec;
      color: #25252a;
      font-size: 14px;
      line-height: 1.45;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    button,
    select,
    input {
      color: inherit;
    }
    button {
      border: 0;
    }
    svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent, #7560ce);
      outline-offset: 3px;
    }
    button:active {
      transform: translateY(1px);
    }
    a {
      color: inherit;
    }
    h1,
    h2,
    h3,
    p {
      margin: 0;
    }
    h1 {
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.8px;
      line-height: 1.2;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.15px;
    }
    h3 {
      font-size: 14px;
      font-weight: 600;
    }
    small,
    .small {
      font-size: 12px;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .board {
      max-width: 1320px;
      margin: auto;
      padding: 24px 28px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .board-title strong {
      font-size: 18px;
      letter-spacing: -0.5px;
    }
    .board-title p {
      color: #686871;
      font-size: 12px;
      margin-top: 3px;
    }
    .directions {
      display: flex;
      padding: 4px;
      border-radius: 10px;
      background: #dadde3;
      gap: 3px;
    }
    .directions button {
      background: none;
      padding: 9px 13px;
      border-radius: 7px;
      color: #5d6069;
      font-size: 12px;
      font-weight: 550;
    }
    .directions button[aria-pressed="true"] {
      background: white;
      box-shadow: 0 1px 4px #0000000e;
      color: #25252a;
    }
    .lab-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .lab-controls select,
    .lab-controls button {
      background: #f7f8fa;
      border: 1px solid #ced0d6;
      padding: 8px;
      border-radius: 7px;
      font-size: 12px;
    }
    .window {
      --accent: #b0a2fb;
      --tint: #342f4b;
      --bg: #202124;
      --sheet: #26272b;
      --rail: #191a1d;
      --side: #212225;
      --line: #393a40;
      --fg: #ededf0;
      --muted: #b1b2ba;
      --hover: #2f3035;
      --good: #8bd0af;
      --warn: #ecc185;
      --bad: #ef9c9c;
      --button: #33343a;
      --radius: 10px;
      --secondary: 232px;
      color: var(--fg);
      background: var(--bg);
      margin: 0 auto;
      border: 1px solid #393940;
      border-radius: 13px;
      overflow: hidden;
      width: calc(100% - 56px);
      max-width: 1264px;
      height: 780px;
      box-shadow: 0 20px 65px #0002;
      display: grid;
      grid-template-rows: 46px minmax(0, 1fr);
      position: relative;
    }
    .window.mac {
      --accent: #6750b8;
      --tint: #e9e5f6;
      --bg: #fafafa;
      --sheet: #fff;
      --rail: #e9e9ed;
      --side: #f0f0f3;
      --line: #dedee4;
      --fg: #29292f;
      --muted: #676771;
      --hover: #e7e7ed;
      --good: #2f7555;
      --warn: #8c581b;
      --bad: #a24141;
      --button: #f0f0f4;
      --radius: 11px;
      --secondary: 236px;
      border-color: #cacbd2;
    }
    .window.studio {
      --accent: #355bb2;
      --tint: #e7edf9;
      --bg: #f7f8fa;
      --sheet: #fff;
      --rail: #252b36;
      --side: #ebedf1;
      --line: #d8dce5;
      --fg: #282f3d;
      --muted: #636d7e;
      --hover: #e0e5ee;
      --good: #2f7657;
      --warn: #925c20;
      --bad: #a34646;
      --button: #ebeff5;
      --radius: 5px;
      --secondary: 208px;
      border-color: #c5cbd5;
    }
    .window.geist {
      font-family:
        Geist,
        -apple-system,
        sans-serif;
    }
    .titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--rail);
    }
    .lights {
      display: flex;
      gap: 7px;
      margin-right: 16px;
    }
    .lights i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fa6056;
    }
    .lights i:nth-child(2) {
      background: #f5bb3c;
    }
    .lights i:nth-child(3) {
      background: #39be4e;
    }
    .titlebar .wordmark {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 600;
      font-size: 12px;
    }
    .wordmark img {
      width: 20px;
      height: 20px;
    }
    .titlebar .disclosure {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
    }
    .studio .titlebar {
      color: #e6eaf2;
    }
    .studio .titlebar .disclosure {
      color: #b1bacb;
    }
    .workspace {
      display: grid;
      grid-template-columns: 62px var(--secondary) minmax(0, 1fr);
      min-height: 0;
    }
    .workspace.no-context {
      grid-template-columns: 62px minmax(0, 1fr);
    }
    .rail {
      padding: 17px 9px 12px;
      background: var(--rail);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 3;
    }
    .rail button {
      position: relative;
      background: transparent;
      color: var(--muted);
      width: 42px;
      height: 42px;
      border-radius: 9px;
      display: grid;
      place-items: center;
    }
    .rail button:hover {
      background: var(--hover);
      color: var(--fg);
    }
    .rail button[aria-current="page"] {
      color: var(--accent);
      background: var(--tint);
    }
    .rail button[aria-current="page"]:before {
      content: "";
      position: absolute;
      left: -10px;
      top: 12px;
      height: 18px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }
    .rail button .tip {
      position: absolute;
      left: 52px;
      background: var(--fg);
      color: var(--bg);
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      display: none;
      z-index: 20;
      font-size: 12px;
    }
    .rail button:hover .tip,
    .rail button:focus-visible .tip {
      display: block;
    }
    .rail-spacer {
      flex: 1;
    }
    .rail .rail-lamp {
      height: 32px;
      width: 32px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .rail-lamp:before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--good);
      border-radius: 50%;
    }
    .rail-lamp.offline:before {
      background: var(--warn);
    }
    .studio .rail {
      --fg: #edf1fa;
      --muted: #b0bacb;
      --hover: #354051;
      --tint: #415574;
      --accent: #c4d7ff;
      border: 0;
    }
    .context {
      background: var(--side);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .context-head {
      padding: 23px 18px 15px;
    }
    .context-head h2 {
      font-size: 16px;
    }
    .context-head p {
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
    }
    .context-list {
      padding: 0 10px;
      overflow: auto;
      flex: 1;
    }
    .context button.item {
      display: flex;
      text-align: left;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 11px;
      margin-bottom: 3px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      position: relative;
      min-height: 39px;
    }
    .context button.item svg {
      width: 16px;
      height: 16px;
    }
    .context button.item:hover {
      background: var(--hover);
      color: var(--fg);
    }
    .context button.item[aria-current="page"] {
      background: var(--tint);
      color: var(--fg);
      font-weight: 550;
    }
    .context .item .label {
      flex: 1;
      min-width: 0;
    }
    .context .item .label small {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 4px;
    }
    .context .item .end {
      font-size: 11px;
      color: var(--muted);
    }
    .context .item[aria-current="page"] .end {
      color: var(--accent);
    }
    .context .divider {
      border-top: 1px solid var(--line);
      margin: 16px 10px;
    }
    .context .subheading {
      padding: 14px 11px 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .context-foot {
      padding: 16px 20px;
      color: var(--muted);
      font-size: 11px;
      border-top: 1px solid var(--line);
    }
    .pane {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      height: 54px;
      flex-shrink: 0;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 0 26px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
    .toolbar .crumb {
      color: var(--fg);
      font-weight: 550;
    }
    .toolbar .spacer {
      flex: 1;
    }
    .toolbar button {
      background: none;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px;
      border-radius: 5px;
    }
    .toolbar button:hover {
      background: var(--hover);
    }
    .toolbar kbd {
      font: 11px inherit;
      border: 1px solid var(--line);
      padding: 1px 4px;
      border-radius: 4px;
    }
    .context-toggle {
      display: flex !important;
    }
    .content {
      overflow: auto;
      min-height: 0;
      flex: 1;
      padding: 35px 38px 32px;
    }
    .page-head {
      margin-bottom: 28px;
    }
    .page-head p {
      color: var(--muted);
      margin-top: 9px;
      max-width: 58ch;
      font-size: 13px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin: 0 0 15px;
    }
    .muted {
      color: var(--muted);
    }
    .badge {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      font-weight: 500;
      color: var(--good);
      white-space: nowrap;
    }
    .badge:before {
      content: "✓";
      font-size: 12px;
    }
    .badge.working {
      color: var(--fg);
    }
    .badge.working:before {
      content: "◌";
      font-size: 15px;
    }
    .badge.attention {
      color: var(--warn);
    }
    .badge.attention:before {
      content: "!";
      border: 1px solid currentColor;
      border-radius: 50%;
      height: 13px;
      width: 13px;
      text-align: center;
      font-size: 10px;
      line-height: 12px;
    }
    .badge.unknown {
      color: var(--warn);
    }
    .badge.unknown:before {
      content: "?";
      border: 1px solid currentColor;
      border-radius: 50%;
      width: 13px;
      height: 13px;
      text-align: center;
      font-size: 10px;
      line-height: 12px;
    }
    .badge.offline,
    .badge.failed {
      color: var(--bad);
    }
    .badge.offline:before,
    .badge.failed:before {
      content: "×";
    }
    .btn {
      background: var(--button);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }
    .btn:hover {
      filter: brightness(1.08);
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #201939;
    }
    .mac .btn.primary {
      color: white;
    }
    .studio .btn.primary {
      color: white;
    }
    .btn.link {
      background: none;
      border-color: transparent;
      color: var(--accent);
      padding-left: 0;
    }
    .btn.icon {
      padding: 7px;
    }
    .btn.icon svg {
      width: 16px;
      height: 16px;
    }
    .form-group {
      margin-bottom: 28px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 19px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child {
      border-bottom: 0;
    }
    .row-copy {
      min-width: 0;
      max-width: 52ch;
    }
    .row-copy p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }
    .row-copy h3 {
      font-size: 13px;
    }
    .row select,
    .row input,
    .input {
      border: 1px solid var(--line);
      background: var(--button);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12px;
      min-width: 164px;
      max-width: 100%;
    }
    .switch {
      width: 34px;
      height: 20px;
      border-radius: 12px;
      background: var(--line);
      border: 0;
      padding: 3px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .switch:before {
      content: "";
      height: 14px;
      width: 14px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 1px 2px #0003;
    }
    .switch[aria-checked="true"] {
      background: var(--accent);
      justify-content: flex-end;
    }
    .form-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-top: 21px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
    .note {
      font-size: 12px;
      color: var(--muted);
      padding: 16px 0;
      line-height: 1.65;
      max-width: 64ch;
    }
    .mac .form-group {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 18px;
    }
    .studio .row {
      padding: 13px 0;
    }
    .studio .content {
      padding: 28px 28px;
    }
    .studio h1 {
      font-size: 25px;
    }
    .studio .form-group {
      border-top: 1px solid var(--line);
    }
    .status-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 25px;
      margin-bottom: 27px;
    }
    .status-emblem {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--tint);
      display: grid;
      place-items: center;
      color: var(--accent);
    }
    .status-emblem svg {
      width: 24px;
      height: 24px;
    }
    .status-hero h1 {
      font-size: 24px;
    }
    .status-hero p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }
    .status-hero .btn {
      margin-left: auto;
    }
    .home-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 242px;
      gap: 36px;
    }
    .health {
      border-left: 1px solid var(--line);
      padding-left: 24px;
    }
    .health-item {
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }
    .health-item h3 {
      font-size: 12px;
      margin-bottom: 6px;
    }
    .health-item p {
      color: var(--muted);
      font-size: 11px;
      margin-top: 7px;
    }
    .health-item button {
      margin-top: 9px;
      font-size: 11px;
    }
    .task-row {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 15px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
      color: var(--fg);
      background: none;
    }
    .task-row:hover {
      background: var(--hover);
    }
    .task-number {
      height: 34px;
      width: 34px;
      display: grid;
      place-items: center;
      background: var(--button);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 550;
      flex-shrink: 0;
    }
    .task-copy {
      flex: 1;
      min-width: 0;
    }
    .task-copy strong {
      font-size: 13px;
      font-weight: 550;
    }
    .task-copy p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .task-row .arrow {
      color: var(--muted);
    }
    .task-row .badge {
      font-size: 10px;
    }
    .attention-banner {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 18px;
      margin-top: 23px;
    }
    .attention-banner svg {
      color: var(--warn);
    }
    .attention-banner p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }
    .attention-banner .btn {
      margin-top: 12px;
    }
    .quiet {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      margin-top: 23px;
      color: var(--muted);
      font-size: 12px;
    }
    .mac .home-layout {
      grid-template-columns: 1fr;
    }
    .mac .health {
      grid-row: 1;
      border: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      background: var(--sheet);
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 15px 20px;
    }
    .mac .health > .section-title {
      grid-column: 1/-1;
      margin: 0;
    }
    .mac .health-item {
      border: 0;
      padding: 0;
    }
    .mac .home-tasks {
      margin-top: 5px;
    }
    .mac .status-hero {
      border: 0;
      margin-bottom: 16px;
    }
    .studio .home-layout {
      grid-template-columns: minmax(0, 1fr) 214px;
      gap: 28px;
    }
    .studio .task-row {
      padding: 11px 0;
    }
    .studio .task-number {
      border: 0;
      background: none;
      width: 23px;
    }
    .studio .status-hero {
      padding-bottom: 19px;
      margin-bottom: 23px;
    }
    .folder-layout {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      gap: 25px;
    }
    .folder-picker {
      border-right: 1px solid var(--line);
      padding-right: 16px;
    }
    .folder-button {
      background: none;
      display: flex;
      gap: 11px;
      text-align: left;
      width: 100%;
      color: var(--muted);
      padding: 13px 11px;
      border-radius: 7px;
      margin-bottom: 4px;
    }
    .folder-button[aria-current="page"] {
      background: var(--tint);
      color: var(--fg);
    }
    .folder-button p {
      font-size: 11px;
      margin-top: 4px;
      color: var(--muted);
    }
    .folder-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    .folder-title h2 {
      font-size: 18px;
    }
    .folder-detail code {
      display: block;
      color: var(--muted);
      margin: 6px 0 14px;
    }
    .folder-detail .row {
      gap: 15px;
    }
    .folder-detail .row select {
      min-width: 125px;
    }
    .folder-detail .section-title {
      margin-top: 25px;
    }

      if (!b) return;
      if (b.dataset.direction) {
        state.direction = b.dataset.direction;
        render();
        document.querySelector(`[data-direction="${state.direction}"]`).focus();
        return;
      }
      if (b.dataset.root) {
        state.root = b.dataset.root;
        state.page =
          b.dataset.page || (state.root === "setup" ? "overview" : state.page);
        if (b.dataset.chat) state.chat = Number(b.dataset.chat);
        if (b.dataset.event) state.event = Number(b.dataset.event);
        state.contextOpen = false;
        render();
        document
          .querySelector("#pane h1,#pane h2")
          ?.setAttribute("tabindex", "-1");
        document
          .querySelector("#pane h1,#pane h2")
          ?.focus({ preventScroll: true });
        return;
      }
      const a = b.dataset.action;
      if (a === "toggle") {
        b.setAttribute(
          "aria-checked",
          b.getAttribute("aria-checked") !== "true",
        );
        return;
      }
      if (a === "context") {
        if (innerWidth > 850) {
          state.menuHidden = !state.menuHidden;
        } else {
          state.menuHidden = false;
          state.contextOpen = !state.contextOpen;
        }
        render();
        if (state.contextOpen)
          document.querySelector(".context .item")?.focus();
        return;
      }
      if (a === "close-context") {
        state.contextOpen = false;
        render();
        document.querySelector(".context-toggle")?.focus();
        return;
      }
      if (a === "folder") {
        state.folder = Number(b.dataset.index);
        render();
        return;
      }
      if (a === "save") {
        toast(
          "Changes saved in this prototype only. Farol settings were not changed.",
        );
        return;
      }
      if (a === "check-update") {
        state.updateChecked = true;
        render();
        toast("Sample update state displayed. No server was contacted.");
        return;
      }
      if (a === "git-access") {
        messageDialog(
          "Git history & user settings",
          "This permission includes Git metadata, past file versions, hooks and your Git user settings. These can include information beyond the current folder. In the final app, review this scope before allowing it, then verify the folder again. This prototype cannot grant access.",
        );
        return;
      }
      if (a === "connection-check") {
        messageDialog(
          "Review a connection check",
          "A live check would send a short message through ChatGPT using the selected Farol app. Its result can be verified, failed or unknown. This prototype previews the review step only; it cannot send a check.",
        );
        return;
      }
      if (a === "restore") {
        messageDialog(
          "Restore Farol 0.1.7?",
          "The final application would review update readiness and restart into the previously accepted version. Active work and unknown outcomes must be resolved by the existing update flow. This preview does not restart or restore anything.",
          "Back to Updates",
        );
        return;
      }
      if (a === "remove-folder") {
        messageDialog(
          "Remove this folder?",
          "In the final app, removing a folder revokes future access without deleting its files. This is a preview of that review step; no folder access will change.",
        );
        return;
      }
      if (a === "add-folder") {
        openDialog(
          `<h2>Add a folder</h2><p>In the final app, choose a folder using the Mac file picker. New folders start read-only. This field previews the naming step only.</p><label>Folder label<input class="input" aria-label="Folder label" placeholder="Project name"></label><div class="dialog-actions">${btn("Cancel", "dialog-close")}${btn("Preview addition", "demo-add", "primary")}</div>`,
        );
        return;
      }
      if (a === "demo-add") {
        const name = document.querySelector("#dialog input").value.trim();
        if (!name) {
          document.querySelector("#dialog input").focus();
          return;
        }
        folders.push({
          name,
          path: "/demo/selected-folder",
          mode: "Read-only",
          verified: false,
        });
        state.folder = folders.length - 1;
        document.querySelector("#dialog").close();
        render();
        toast("Sample folder added to this preview only.");
        return;
      }
      if (a === "signin") {
        messageDialog(
          "Sign in to ChatGPT",
          "The final app opens its isolated embedded ChatGPT surface. This design room does not open an account, read a session or change authentication.",
        );
        return;
      }
      if (a === "report") {
        messageDialog(
          "Sample diagnostic report",
          "Local service: available. ChatGPT: sample connection. Activity: projected metadata only. No live system information was collected.",
        );
        return;
      }
      if (a === "dialog-close") {
        document.querySelector("#dialog").close();
        return;
      }
      if (a === "search") {
        openDialog(
          `<h2>Find a page</h2><label>Page name<input class="input" id="page-search" aria-label="Page name" placeholder="Try Updates or Folders"></label><div id="search-results"></div><div class="dialog-actions">${btn("Close", "dialog-close")}</div>`,
        );
        searchPages("");
        return;
      }
    });
    function searchPages(q) {
      const candidates = [
        ["home", null, "Home"],
        ["chat", null, "ChatGPT"],
        ["activity", null, "Activity"],
        ["setup", "overview", "Setup"],
        ...settingPages.map(([id, title]) => ["settings", id, title]),
      ].filter((p) => p[2].toLowerCase().includes(q.toLowerCase()));
      document.querySelector("#search-results").innerHTML = candidates.length
        ? candidates
            .map(
              ([root, page, title]) =>
                `<button class="folder-button" ${nav(root, page)}>${esc(title)}</button>`,
            )
            .join("")
        : '<p class="note">No matching page. Try another name.</p>';
    }
    document.addEventListener("input", (e) => {
      if (e.target.id === "page-search") searchPages(e.target.value);
    });
    document.addEventListener("change", (e) => {
      if (e.target.dataset.draft) {
        drafts[e.target.dataset.draft] = e.target.value;
        if (e.target.dataset.draft === "Folder access")
          folders[state.folder].mode = e.target.value;
      }
      if (e.target.id === "fixture") {
        state.fixture = e.target.value;
        state.updateChecked = false;
        render();
      }
      if (e.target.id === "font") {
        state.font = e.target.value;
        render();
      }
      if (e.target.id === "activity-filter") {
        state.filter = e.target.value;
        if (state.filter === "attention") state.event = 2;
        render();
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && state.contextOpen) {
        e.preventDefault();
        state.contextOpen = false;
        render();
        document.querySelector(".context-toggle")?.focus();
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        document.querySelector('[data-action="search"]').click();
      }
      if (e.metaKey && e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
        if (state.root !== "home") {
          document.querySelector('[data-action="context"]')?.click();
        }
      }
      if (
        e.metaKey &&
        ["1", "2", "3", "4", ","].includes(e.key) &&
        !document.querySelector("#dialog").open
      ) {
        e.preventDefault();
        state.root = {
          1: "home",
          2: "chat",
          3: "activity",
          4: "setup",
          ",": "settings",
        }[e.key];
        state.page = state.root === "setup" ? "overview" : "general";
        state.contextOpen = false;
        render();
      }
    });
    document.addEventListener("click", (e) => {
      if (e.target.closest("#search-results button[data-root]"))
        document.querySelector("#dialog").close();
    });
    render();
  </script>
</html>
